name = "et-al"
main = "src/index.ts"
compatibility_date = "2026-07-20"
compatibility_flags = ["nodejs_compat"]
account_id = "e4ea14de30df5be2da9c9e22e8e377ed"
workers_dev = true
preview_urls = false

# v7: D1 is the source of truth for the whole personal OS — workspaces,
# objectives, tasks, documents/blocks, sources, insights, decisions, the graph.
[[d1_databases]]
binding = "DB"
database_name = "et-al"
database_id = "2ff89323-c48e-4c15-809a-7187b1bde9dc"

# Assets (uploads, images) and Markdown export snapshots.
[[r2_buckets]]
binding = "VAULT"
bucket_name = "et-al-vault"

# Semantic search over Insights. Embeddings run on Workers AI — a Cloudflare
# binding, not an external provider — so no AI vendor key enters the platform.
# Optional at runtime: without it, search is keyword-only (D1 FTS5).
[[vectorize]]
binding = "VECTORIZE"
index_name = "et-al-index"

[ai]
binding = "AI"

# Deterministic ingest queue: fetch/parse a captured source, embed an insight.
# Only url/pdf/video captures enqueue; notes/ideas are complete on capture.
[[queues.producers]]
binding = "JOBS"
queue = "et-al-jobs"

[[queues.consumers]]
queue = "et-al-jobs"
max_batch_size = 10
max_batch_timeout = 5
max_retries = 2

# No cron triggers: the scheduled() handler went away with the v6 implementation
# and these were left behind, so production threw "Handler does not export a
# scheduled() function" every five minutes. They come back with a handler that
# needs them, not before.

[vars]
APP_NAME = "et al."

# CO-DEPLOY (web app): the Next client is served from this Worker so the app and
# API share one origin — which lets the `et_al_session` cookie stay SameSite=Lax
# with no CORS. `client/out` is Next's static export; `npm run deploy` builds it.
[assets]
directory = "client/out"
# /files/* must reach the Worker: otherwise not_found_handling below serves
# the SPA shell for every image URL and nothing in R2 is ever reachable.
run_worker_first = ["/api/*", "/mcp", "/mcp/*", "/health", "/files/*"]
not_found_handling = "single-page-application"
