name = "et-al"
main = "src/index.ts"
compatibility_date = "2026-07-20"
compatibility_flags = ["nodejs_compat"]
account_id = "e4ea14de30df5be2da9c9e22e8e377ed"
workers_dev = true
preview_urls = false

# The source of truth: notes, blocks, tasks, sources, proposals, the event log,
# and the FTS5 keyword index. Schema: migrations/.
[[d1_databases]]
binding = "DB"
database_name = "et-al"
database_id = "2ff89323-c48e-4c15-809a-7187b1bde9dc"

# Images pasted into notes, served back from /files/*.
[[r2_buckets]]
binding = "VAULT"
bucket_name = "et-al-vault"

# The semantic half of search: one vector per accepted insight note. Embeddings
# run on Workers AI, a Cloudflare binding, so no model vendor key lives here.
# Optional at runtime: without it, search is keyword-only.
[[vectorize]]
binding = "VECTORIZE"
index_name = "et-al-index"

[ai]
binding = "AI"

# Background work: fetch a captured link (preview, index, extract), and embed an
# accepted insight. Captures without a link need neither.
[[queues.producers]]
binding = "JOBS"
queue = "et-al-jobs"

[[queues.consumers]]
queue = "et-al-jobs"
max_batch_size = 10
max_batch_timeout = 5
max_retries = 2

# No scheduled work. Declared empty rather than omitted: leaving [triggers] out
# keeps whatever crons are already deployed, and nothing handles them any more.
[triggers]
crons = []

[vars]
APP_NAME = "et al."

# CO-DEPLOY (web app): the Next client is served from this Worker so the app and
# API share one origin — which lets the `et_al_session` cookie stay SameSite=Lax
# with no CORS. `client/out` is Next's static export; `npm run deploy` builds it.
[assets]
directory = "client/out"
# /files/* must reach the Worker: otherwise not_found_handling below serves
# the SPA shell for every image URL and nothing in R2 is ever reachable.
run_worker_first = ["/api/*", "/mcp", "/mcp/*", "/health", "/files/*"]
not_found_handling = "single-page-application"

# Used only by the test suite (vitest.config.ts). Bindings are not inherited by
# environments, so this one deliberately declares no Workers AI and no
# Vectorize: both are remote-only, and a test must never spend money or reach
# production. Tests that need a model pass a fake one in.
[env.test]
vars = { APP_NAME = "et al." }

[[env.test.d1_databases]]
binding = "DB"
database_name = "et-al"
database_id = "2ff89323-c48e-4c15-809a-7187b1bde9dc"

[[env.test.r2_buckets]]
binding = "VAULT"
bucket_name = "et-al-vault"

[[env.test.queues.producers]]
binding = "JOBS"
queue = "et-al-jobs"
